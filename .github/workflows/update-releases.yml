# Keeps site/data/releases.json up to date so the website never has to call
# the GitHub API itself (60 requests/hour limit per visitor).
# Runs every 6 hours, or by hand from the Actions tab.
# If your site files are not in a "site/" folder, change OUT below.
name: Update releases data

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_REPO: SanoBld/LastStats-App
  OUT: site/data/releases.json

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch releases and stars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$(dirname "$OUT")"
          stars=$(gh api "repos/$APP_REPO" --jq .stargazers_count)
          gh api "repos/$APP_REPO/releases?per_page=100" --paginate | jq -s --argjson stars "$stars" '
            {
              updated: (now | todate),
              stars: $stars,
              releases: (add | map(select(.draft | not)) | map({
                tag_name, name, published_at, prerelease, draft, body,
                assets: (.assets | map({name, size, download_count, browser_download_url}))
              }))
            }' > "$OUT"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          git diff --cached --quiet || git commit -m "chore: update releases data" && git push

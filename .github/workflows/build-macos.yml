name: Build macOS

# Reusable: called by build-all.yml / release.yml — also runnable manually.
# Flutter always builds a universal app (Intel + Apple Silicon). For each
# target we publish a .zip (used by the in-app updater) and a .dmg installer:
#   - universal : both chips in one app (names kept: old app versions use them)
#   - x64       : Intel Macs only, smaller (universal build, arm64 stripped)
#   - arm64     : Apple Silicon only, smaller (universal build, x86_64 stripped)
on:
  workflow_call:
    inputs:
      version:
        description: 'Version to build (e.g. 2.7.0). Empty = dev build'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 2.7.0). Empty = dev build'
        required: false
        type: string
        default: ''

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: universal
            zip: laststats-macos.zip            # name kept: used by UpdateService
            dmg: LastStats-macos.dmg
          - arch: x64
            zip: laststats-macos-x64.zip
            dmg: LastStats-macos-x64.dmg
          - arch: arm64
            zip: laststats-macos-arm64.zip
            dmg: LastStats-macos-arm64.dmg
    runs-on: macos-latest
    env:
      VERSION: ''
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      # Ad-hoc/dev build (no version given): never claim to be a real release.
      - name: Resolve version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="0.0.0-dev.${{ github.run_number }}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build macOS (universal)
        run: flutter build macos --release --build-name="$VERSION" --build-number=${{ github.run_number }}

      # Strips the other CPU architecture from the app (x64 / arm64 only).
      - name: Thin app to ${{ matrix.arch }}
        if: matrix.arch != 'universal'
        run: |
          sed -i '' 's/\r$//' macos/packaging/thin-arch.sh
          bash macos/packaging/thin-arch.sh build/macos/Build/Products/Release ${{ matrix.arch }}

      # cd into the actual app folder first, so the zip does not contain the
      # long "build/macos/Build/Products/Release/" path inside it.
      - name: Zip macOS build
        run: |
          cd build/macos/Build/Products/Release
          zip -r -y "$GITHUB_WORKSPACE/${{ matrix.zip }}" .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip }}
          path: ${{ matrix.zip }}

      # Installer: a .dmg that opens with the app + an "Applications" shortcut.
      - name: Build DMG installer
        run: |
          sed -i '' 's/\r$//' macos/packaging/build-dmg.sh
          bash macos/packaging/build-dmg.sh ${{ matrix.dmg }}
      - uses: actions/upload-artifact@v4
        with:
          name: laststats-macos-${{ matrix.arch }}-dmg
          path: ${{ matrix.dmg }}

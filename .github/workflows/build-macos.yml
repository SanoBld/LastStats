name: Build macOS

# Reusable: called by build-all.yml / release.yml, also runnable manually.
# Language: Fastlane (Ruby) -> macos/fastlane/Fastfile, lane "package".
# Flutter always builds a universal app (Intel + Apple Silicon). Per target:
# a .zip (used by the in-app updater) and a .dmg installer.
#   - universal : both chips (names kept: old app versions use them)
#   - x64       : Intel only (arm64 stripped)
#   - arm64     : Apple Silicon only (x86_64 stripped)
on:
  workflow_call:
    inputs:
      version:
        description: 'Version to build (e.g. 2.7.0). Empty = dev build'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 2.7.0). Empty = dev build'
        required: false
        type: string
        default: ''

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: universal
            zip: laststats-macos.zip            # name kept: used by UpdateService
            dmg: LastStats-macos.dmg
          - arch: x64
            zip: laststats-macos-x64.zip
            dmg: LastStats-macos-x64.dmg
          - arch: arm64
            zip: laststats-macos-arm64.zip
            dmg: LastStats-macos-arm64.dmg
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Ruby + Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: macos

      - name: Get dependencies
        run: flutter pub get
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build, thin, zip and DMG (Fastlane)
        working-directory: macos
        env:
          APP_VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: bundle exec fastlane package arch:${{ matrix.arch }} zip:${{ matrix.zip }} dmg:${{ matrix.dmg }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip }}
          path: ${{ matrix.zip }}
      - uses: actions/upload-artifact@v4
        with:
          name: laststats-macos-${{ matrix.arch }}-dmg
          path: ${{ matrix.dmg }}

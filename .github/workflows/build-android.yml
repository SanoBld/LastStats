name: Build Android

# Reusable: called by build-all.yml / release.yml — also runnable manually.
# Builds a universal APK (works on every phone) plus one smaller APK per CPU
# architecture (arm64-v8a, armeabi-v7a, x86_64). All of them are uploaded
# together in a single artifact.
on:
  workflow_call:
    inputs:
      version:
        description: 'Version to build (e.g. 2.7.0). Empty = dev build'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 2.7.0). Empty = dev build'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: ''
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      # Ad-hoc/dev build (no version given): never claim to be a real release.
      - name: Resolve version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="0.0.0-dev.${{ github.run_number }}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # Universal APK — works on every phone, biggest file size.
      - name: Build Android (universal APK)
        run: |
          flutter build apk --release --build-name="$VERSION" --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk app-universal-release.apk

      # Per-CPU-architecture APKs — smaller, faster to install.
      - name: Build Android (per-architecture APKs)
        run: flutter build apk --release --split-per-abi --build-name="$VERSION" --build-number=${{ github.run_number }}

      # Put every APK in one flat folder so the upload step is simple.
      - name: Collect APKs
        run: |
          mkdir -p android-apks
          cp app-universal-release.apk android-apks/
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk android-apks/
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   android-apks/
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk      android-apks/
      - uses: actions/upload-artifact@v4
        with:
          name: laststats-android-apk
          path: android-apks/*

name: Build Android

# Reusable: called by build-all.yml / release.yml — also runnable manually.
# One job per target: a universal APK (works on every phone, biggest file) and
# one smaller APK per CPU architecture (arm64-v8a, armeabi-v7a, x86_64).
# File names are what the in-app updater looks for, so don't rename them.
on:
  workflow_call:
    inputs:
      version:
        description: 'Version to build (e.g. 2.7.0). Empty = dev build'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 2.7.0). Empty = dev build'
        required: false
        type: string
        default: ''

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: universal
            flags: ''
            src: app-release.apk
            apk: app-universal-release.apk
          - abi: arm64-v8a                      # most modern phones (2018+)
            flags: '--split-per-abi --target-platform android-arm64'
            src: app-arm64-v8a-release.apk
            apk: app-arm64-v8a-release.apk
          - abi: armeabi-v7a                    # older 32-bit phones
            flags: '--split-per-abi --target-platform android-arm'
            src: app-armeabi-v7a-release.apk
            apk: app-armeabi-v7a-release.apk
          - abi: x86_64                         # emulators / x86 tablets
            flags: '--split-per-abi --target-platform android-x64'
            src: app-x86_64-release.apk
            apk: app-x86_64-release.apk
    runs-on: ubuntu-latest
    env:
      VERSION: ''
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      # Ad-hoc/dev build (no version given): never claim to be a real release.
      - name: Resolve version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="0.0.0-dev.${{ github.run_number }}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build Android (${{ matrix.abi }})
        shell: bash
        run: |
          flutter build apk --release ${{ matrix.flags }} --build-name="$VERSION" --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/${{ matrix.src }} ${{ matrix.apk }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.apk }}
          path: ${{ matrix.apk }}

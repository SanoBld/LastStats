name: Deploy Flutter Web to gh-pages

# Language: Dart -> tool/ci/build_web.dart
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # base-href must match the repo name + /app/ subfolder
      # (site URL: https://sanobld.github.io/LastStats/app/)
      - name: Build web app (Dart)
        run: dart run tool/ci/build_web.dart /LastStats/app/

      # Publish only to /app subfolder. keep_files protects the existing /docs folder
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          destination_dir: app
          keep_files: true

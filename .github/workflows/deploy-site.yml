name: Deploy showcase site to GitHub Pages

on:
  # every push to main: refreshes the site and the pushes page (site/data/commits.json)
  push:
    branches: [main]
  # refresh the releases data (site/data/releases.json) every 6 hours
  schedule:
    - cron: '0 */6 * * *'
  # and right when a release is published / edited / deleted
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: write

# same group as dartdoc.yml: never push to gh-pages at the same time
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

env:
  APP_REPO: SanoBld/LastStats-App

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The site reads this file instead of calling the GitHub API (60 requests/hour
      # limit per visitor). It only exists in the published site, it is NOT committed,
      # so there are no extra commits and no conflicts with other workflows.
      - name: Generate releases data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p site/data
          stars=$(gh api "repos/$APP_REPO" --jq .stargazers_count)
          gh api "repos/$APP_REPO/releases?per_page=100" --paginate | jq -s --argjson stars "$stars" '
            {
              updated: (now | todate),
              stars: $stars,
              releases: (add | map(select(.draft | not)) | map({
                tag_name, name, published_at, prerelease, draft, body,
                assets: (.assets | map({name, size, download_count, browser_download_url}))
              }))
            }' > site/data/releases.json
          jq '{updated, stars, count: (.releases | length)}' site/data/releases.json

          # pushes page: last 300 commits + which commit each tag points to
          tags=$(gh api "repos/$APP_REPO/tags?per_page=100" --jq '[.[] | {name, sha: .commit.sha}]')
          for p in 1 2 3; do gh api "repos/$APP_REPO/commits?per_page=100&page=$p"; done | jq -s --argjson tags "$tags" '
            {
              updated: (now | todate),
              commits: (add | map(. as $c | {
                sha, message: .commit.message, date: .commit.author.date,
                author: (.author.login // .commit.author.name),
                avatar: .author.avatar_url, url: .html_url,
                tags: [$tags[] | select(.sha == $c.sha) | .name]
              }))
            }' > site/data/commits.json
          jq '{updated, count: (.commits | length)}' site/data/commits.json

      # Publish the static site to the root of gh-pages.
      # keep_files protects the /app subfolder (Flutter web build).
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          keep_files: true

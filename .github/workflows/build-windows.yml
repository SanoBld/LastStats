name: Build Windows

# Reusable: called by build-all.yml / release.yml — also runnable manually.
# Builds x64 and ARM64 natively (Flutter can't cross-compile Windows), and for
# each one: a .zip (used by the in-app updater) and a setup .exe installer
# (Program Files, Start Menu + optional Desktop shortcut, uninstaller).
#
# NOTE: the ARM64 job uses GitHub's hosted "windows-11-arm" runner. If it fails
# with "no runner matching 'windows-11-arm'", that label isn't enabled for this
# repo/plan yet: remove the arm64 entry from the matrix until it is.
on:
  workflow_call:
    inputs:
      version:
        description: 'Version to build (e.g. 2.7.0). Empty = dev build'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 2.7.0). Empty = dev build'
        required: false
        type: string
        default: ''

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            zip: laststats-windows.zip          # name kept: used by UpdateService
          - arch: arm64
            runner: windows-11-arm              # GitHub-hosted native ARM64 runner
            zip: laststats-windows-arm64.zip
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ''
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Flutter
        if: matrix.arch == 'x64'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # subosito/flutter-action can't always resolve an arm64 SDK, so on ARM
      # we clone Flutter directly (same approach as the Linux ARM64 job).
      - name: Install Flutter (arm64)
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          git clone https://github.com/flutter/flutter.git -b stable --depth 1 "$env:USERPROFILE\flutter"
          echo "$env:USERPROFILE\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Get dependencies
        run: flutter pub get
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons
      # Ad-hoc/dev build (no version given): never claim to be a real release.
      - name: Resolve version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="0.0.0-dev.${{ github.run_number }}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build Windows (${{ matrix.arch }})
        shell: bash
        run: flutter build windows --release --build-name="$VERSION" --build-number=${{ github.run_number }}

      # The /* makes sure the zip contains the files directly, not a wrapping
      # "Release" folder.
      - name: Zip Windows build
        shell: pwsh
        run: Compress-Archive -Path build/windows/${{ matrix.arch }}/runner/Release/* -DestinationPath ${{ matrix.zip }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip }}
          path: ${{ matrix.zip }}

      # Installer built with Inno Setup.
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: pwsh
        env:
          APP_VERSION: ${{ env.VERSION }}
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\installer.iss /DMyArch=${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        with:
          name: laststats-windows-${{ matrix.arch }}-installer
          path: windows/installer_output/LastStats-Setup-${{ matrix.arch }}.exe

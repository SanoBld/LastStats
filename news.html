<body>

  <div class="cursor-glow" id="cursor-glow" aria-hidden="true"></div>

  <nav class="nav">
    <a href="index.html" class="nav-logo md-ripple" aria-label="Home">
      <span class="ms" aria-hidden="true">home</span>
    </a>
    <div class="nav-toggles">
      <a href="news.html" class="nav-logo nav-news md-ripple" aria-label="Actus"><span class="ms" aria-hidden="true">newspaper</span></a>
      <button type="button" class="lang-toggle md-ripple" aria-label="Switch to English">EN</button>
      <button id="theme-toggle" class="theme-toggle md-ripple" aria-label="Changer de thème">
        <span class="dot"></span>
      </button>
    </div>
  </nav>

  <section class="project-page-header help-header">
    <div class="project-hero-bg" aria-hidden="true"></div>
    <div class="project-hero-grid" aria-hidden="true"></div>

    <a href="index.html" class="back-link md-ripple reveal">
      <span class="ms" style="font-size:16px" aria-hidden="true">chevron_left</span>
      <span data-i18n="common.back_to_laststats">Retour à LastStats</span>
    </a>

    <h1 class="project-page-title reveal" data-i18n="news.title">Actualités</h1>
    <p class="project-page-desc reveal" data-i18n="news.desc">
      Toutes les annonces de LastStats, les mêmes que dans l'application.
    </p>
  </section>

  <section class="help-section releases-section">
    <div class="rel-toolbar reveal">
      <div class="rel-filter" id="nw-filter" role="group">
        <button type="button" class="rel-filter-btn md-ripple is-active" data-filter="all" data-i18n="news.filter_all">Toutes</button>
        <button type="button" class="rel-filter-btn md-ripple" data-filter="feature" data-i18n="news.filter_feature">Nouveautés</button>
        <button type="button" class="rel-filter-btn md-ripple" data-filter="fix" data-i18n="news.filter_fix">Correctifs</button>
        <button type="button" class="rel-filter-btn md-ripple" data-filter="update" data-i18n="news.filter_update">Mises à jour</button>
        <button type="button" class="rel-filter-btn md-ripple" data-filter="alert" data-i18n="news.filter_alert">Alertes</button>
        <button type="button" class="rel-filter-btn md-ripple" data-filter="info" data-i18n="news.filter_info">Infos</button>
      </div>
      <input type="search" class="rel-search cm-search" id="nw-search" autocomplete="off" spellcheck="false" placeholder="Rechercher…" aria-label="Rechercher">
    </div>
    <p class="rel-status" id="nw-status" >Chargement des actualités…</p>
    <div id="nw-list"></div>
    <button type="button" class="rel-more md-ripple" id="nw-more" hidden data-i18n="releases.show_more">Afficher plus</button>
  </section>

  <footer class="footer">
    <p>© 2026 Sano Bld</p>
    <div class="footer-links footer-buttons">
      <a class="md-ripple" href="releases.html" data-i18n="releases.nav">Versions</a>
      <a class="md-ripple" href="commits.html" data-i18n="commits.nav">Pushs</a>
      <a class="md-ripple" href="help.html" data-i18n="common.help">Aide</a>
      <a class="md-ripple" href="https://github.com/SanoBld/LastStats" target="_blank" rel="noopener">GitHub</a>
      <a class="md-ripple" href="https://discord.gg/JjqmkQgZBs" target="_blank" rel="noopener">Discord</a>
      <a class="md-ripple" href="legal.html" data-i18n="common.legal_notice">Mentions légales</a>
    </div>
  </footer>

  <script src="js/news.js"></script>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LastStats</title>
<meta name="description" content="Description du projet LastStats, à jour avec le README du dépôt GitHub.">
<meta name="theme-color" content="#10617D">
<link rel="icon" href="assets/img/favicon-light.png" media="(prefers-color-scheme: light)">
<link rel="icon" href="assets/img/favicon-dark.png" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/project.css">
<link rel="stylesheet" href="css/help.css">
<link rel="stylesheet" href="css/about.css">
<link rel="stylesheet" href="css/expressive.css">
</head>
<body>

  <div class="cursor-glow" id="cursor-glow" aria-hidden="true"></div>

  <nav class="nav">
    <a href="help.html" class="nav-logo md-ripple" aria-label="Aide">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    </a>
    <div class="nav-toggles">
      <button type="button" class="lang-toggle md-ripple" aria-label="Switch to English">EN</button>
      <button id="theme-toggle" class="theme-toggle md-ripple" aria-label="Changer de thème">
        <span class="dot"></span>
      </button>
    </div>
  </nav>

  <section class="project-page-header help-header">
    <div class="project-hero-bg" aria-hidden="true"></div>
    <div class="project-hero-grid" aria-hidden="true"></div>

    <a href="index.html" class="back-link md-ripple reveal">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      <span data-fr="Retour à LastStats" data-en="Back to LastStats">Retour à LastStats</span>
    </a>

    <h1 class="reveal" data-fr="Description du projet" data-en="Project description">Description du projet</h1>
    <p class="help-subtitle reveal-fade" data-fr="Contenu du README du dépôt GitHub, récupéré en direct." data-en="Content of the GitHub repo's README, fetched live.">Contenu du README du dépôt GitHub, récupéré en direct.</p>
  </section>

  <main class="about-content">
    <nav class="readme-toc" id="readme-toc" aria-hidden="true" aria-label="Sommaire">
      <div class="readme-progress-track"><div class="readme-progress-bar" id="readme-progress-bar"></div></div>
      <div class="readme-toc-list" id="readme-toc-list"></div>
    </nav>
    <div id="readme-status" class="about-status" data-fr="Chargement du README…" data-en="Loading README…">Chargement du README…</div>
    <article id="readme-body" class="markdown-body reveal-fade"></article>
  </main>

  <!-- lightbox overlay, reused for every README screenshot -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox-close md-ripple" id="lightbox-close" aria-label="Fermer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
    <div class="lightbox-stage" id="lightbox-stage">
      <img id="lightbox-img" src="" alt="">
    </div>
    <span class="lightbox-hint" id="lightbox-hint">Clique pour zoomer</span>
  </div>

  <footer class="footer">
    <p>© 2026 Sano Bld</p>
    <div class="footer-links">
      <a href="help.html" data-fr="Aide" data-en="Help">Aide</a>
      <a href="https://github.com/SanoBld/LastStats-App" target="_blank" rel="noopener">GitHub</a>
      <a href="https://github.com/SanoBld/LastStats-App/releases" target="_blank" rel="noopener" data-fr="Télécharger" data-en="Download">Télécharger</a>
      <a href="https://discord.gg/JjqmkQgZBs" target="_blank" rel="noopener">Discord</a>
      <a href="index.html" data-fr="Accueil" data-en="Home">Accueil</a>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
  <script src="js/cursor.js"></script>
  <script src="js/ripple.js"></script>
  <script src="js/expressive.js"></script>
  <script src="js/nav-autohide.js"></script>
  <script src="js/lightbox.js"></script>
  <script src="js/readme.js" data-repo="SanoBld/LastStats-App"></script>

</html>
